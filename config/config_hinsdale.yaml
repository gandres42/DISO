%YAML:1.0

SonarTopic: "/son"
OdomTopic: "/odom_pose"
Range: 5 # range was scaled by SIM3 alignment with GT because of the sacle issue mentioned in the paper
GradientThreshold: 60.0 # 0~255
PyramidLayer: 3
FOV: 60.0
GradientInlierThreshold: 50.0
LossThreshold: 10
UseOdom: 0
Tbs: !!opencv-matrix
  rows: 4
  cols: 4
  dt: f
  data: [ 1.000000000,  0.000000000,  0.000000000,  0.0,
          0.000000000,  1.000000000,  0.000000000,  0.0,
          0.000000000,  0.000000000,  1.000000000,  0.0,
          0.000000000,  0.000000000,  0.000000000,  1.0 ]