services:
  diso_srv:
    image: diso # Specify your image name and tag here
    build:
      context: ./
      dockerfile: ./diso.DockerFile # Use the actual name of your Dockerfile
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ~/.ssh:/home/diso/.ssh
      # Point this at the directory holding the rosbag2 (mcap) recording.
      - ${DISO_BAG_DIR:-./bags}:/home/diso/bags
    environment:
      - DISPLAY=$DISPLAY
      - XAUTHORITY=$XAUTHORITY
      - NVIDIA_DRIVER_CAPABILITIES=all
      # rmw_zenoh needs a router; start one with `ros2 run rmw_zenoh_cpp rmw_zenohd`
      # on the host, or drop this line to fall back to the default RMW.
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
    # ports:
      # - "2222:22"
    network_mode: host
    stdin_open: true
    tty: true
    command: >
      bash -i -c "source /home/diso/diso_ws/install/setup.bash &&
                  ros2 launch direct_sonar_odometry aracati2017.launch.py
                    bag:=/home/diso/bags/aracati2017"
